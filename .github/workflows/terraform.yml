name: Terraform CI

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tf.json"
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tf.json"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_ci_offline_plan: "true"
  AWS_ACCESS_KEY_ID: "offline-ci-placeholder"
  AWS_SECRET_ACCESS_KEY: "offline-ci-placeholder"
  AWS_REGION: "ap-south-1"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -lock=false -refresh=false -no-color
